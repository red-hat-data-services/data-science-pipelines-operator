apiVersion: v1
kind: ConfigMap
metadata:
  name: ds-pipeline-server-config-testdsp0
  namespace: default
  labels:
    dsp-version: v2
    app: ds-pipeline-testdsp0
    component: data-science-pipelines
data:
  config.json: |
    {
      "DBConfig": {
        "MySQLConfig": {
          "ExtraParams": {"tls":"false"},
          "GroupConcatMaxLen": "4194304"
         },
        "PostgreSQLConfig": {},
        "ConMaxLifeTime": "120s"
      },
      "ObjectStoreConfig": {
        "PipelinePath": "pipelines",
        "Host": "minio-testdsp0.default.svc.cluster.local",
        "Port": "9000",
        "Secure": false,
        "Region": "minio",
        "BucketName": "mlpipeline"
      },
      "DBDriverName": "mysql",
      "ARCHIVE_CONFIG_LOG_FILE_NAME": "main.log",
      "ARCHIVE_CONFIG_LOG_PATH_PREFIX": "/artifacts",
      "InitConnectionTimeout": "6m"
    }
