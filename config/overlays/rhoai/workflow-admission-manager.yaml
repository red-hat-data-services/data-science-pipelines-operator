apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-science-pipelines-operator-controller-manager
spec:
  template:
    metadata:
      labels:
        pipelines.opendatahub.io/workflow-admission: "true"
    spec:
      volumes:
        - name: workflow-admission-tls
          secret:
            secretName: dspo-workflow-admission-tls
      containers:
        - name: manager
          env:
            - name: DSPO_WORKFLOW_ADMISSION_ENABLED
              value: "true"
            - name: DSPO_WORKFLOW_APPROVAL_KEY_NAMESPACE
              value: redhat-ods-operator
          volumeMounts:
            - name: workflow-admission-tls
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
