name: Build images for PRs
on:
  workflow_run:
    workflows: ["Trigger build images for PRs"]
    types:
      - completed
permissions: {}
env:
  IMAGE_REPO_DSPO: data-science-pipelines-operator
  QUAY_ORG: opendatahub
  GH_USER_EMAIL: 140449482+dsp-developers@users.noreply.github.com
  GH_USER_NAME: dsp-developers
jobs:
  fetch-data:
    name: Fetch workflow payload
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    outputs:
      pr_state: ${{ steps.vars.outputs.pr_state }}
      pr_number: ${{ steps.vars.outputs.pr_number }}
      head_sha: ${{ steps.vars.outputs.head_sha }}
      event_action: ${{ steps.vars.outputs.event_action }}
    steps:
      - name: 'Download artifact'
        uses: actions/github-script@v6
        with:
          script: |
            let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: ${{github.event.workflow_run.id}},
            });
            let matchArtifact = allArtifacts.data.artifacts.filter((artifact) => {
                return artifact.name == "pr"
            })[0];
            let download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: matchArtifact.id,
                archive_format: 'zip',
            });
            let fs = require('fs');
            fs.writeFileSync('${{github.workspace}}/pr.zip', Buffer.from(download.data));
      - run: unzip pr.zip
      - shell: bash
        id: vars
        run: |
          pr_number=$(cat ./pr_number)
          pr_state=$(cat ./pr_state)
          head_sha=$(cat ./head_sha)
          event_action=$(cat ./event_action)

          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR Number: must be numeric"
            exit 1
          fi
          if [[ ! "$pr_state" =~ ^(open|closed)$ ]]; then
            echo "::error::Invalid PR State: must be 'open' or 'closed'"
            exit 1
          fi
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid head_sha: must be a 40-character hex SHA"
            exit 1
          fi
          if [[ ! "$event_action" =~ ^(opened|reopened|closed|synchronize)$ ]]; then
            echo "::error::Invalid Event Action: unexpected value"
            exit 1
          fi

          echo "pr_number=${pr_number}" >> $GITHUB_OUTPUT
          echo "pr_state=${pr_state}" >> $GITHUB_OUTPUT
          echo "head_sha=${head_sha}" >> $GITHUB_OUTPUT
          echo "event_action=${event_action}" >> $GITHUB_OUTPUT

  build-pr-image:
    if: needs.fetch-data.outputs.pr_state == 'open'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    needs: fetch-data
    concurrency:
      group: ${{ github.workflow }}-build-pr-image-${{ needs.fetch-data.outputs.pr_number }}
      cancel-in-progress: true
    env:
      SOURCE_BRANCH: ${{ needs.fetch-data.outputs.head_sha }}
      TARGET_IMAGE_TAG: pr-${{ needs.fetch-data.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v3
      - name: Build Image
        uses: ./.github/actions/build
        env:
          QUAY_ID: ${{ secrets.QUAY_ID }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        with:
          OVERWRITE: true
          IMAGE_REPO: ${{ env.IMAGE_REPO_DSPO }}
          DOCKERFILE: Dockerfile
          GH_REPO: ${{ github.repository }}
      - name: Echo PR metadata
        shell: bash
        env:
          HEAD_SHA: ${{ needs.fetch-data.outputs.head_sha }}
          PR_NUMBER: ${{ needs.fetch-data.outputs.pr_number }}
          PR_STATE: ${{ needs.fetch-data.outputs.pr_state }}
          EVENT_ACTION: ${{ needs.fetch-data.outputs.event_action }}
        run: |
          echo "$HEAD_SHA"
          echo "$PR_NUMBER"
          echo "$PR_STATE"
          echo "$EVENT_ACTION"
      - name: Send comment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          IMG: quay.io/${{ env.QUAY_ORG }}/${{ env.IMAGE_REPO_DSPO }}:${{ env.TARGET_IMAGE_TAG }}
          EVENT_ACTION: ${{ needs.fetch-data.outputs.event_action }}
          PR_NUMBER: ${{ needs.fetch-data.outputs.pr_number }}
          PR_SOURCE_BRANCH: ${{ needs.fetch-data.outputs.head_sha }}
        run: |
          git config user.email "${GH_USER_EMAIL}"
          git config user.name "${GH_USER_NAME}"

          if [[ "$EVENT_ACTION" == "synchronize" ]]; then
            echo "Change to PR detected. A new PR build was completed." >> /tmp/body-file.txt
          fi

          if [[ "$EVENT_ACTION" == "reopened" ]]; then
            echo "PR was re-opened." >> /tmp/body-file.txt
          fi

          echo "A new image has been built to help with testing out this PR: \`${IMG}\`" >> /tmp/body-file.txt

          if [[ "$EVENT_ACTION" == "opened" || "$EVENT_ACTION" == "reopened" ]]; then
            echo "" >> /tmp/body-file.txt
            echo "An OCP cluster where you are logged in as cluster admin is required." >> /tmp/body-file.txt
            echo "" >> /tmp/body-file.txt
            echo "To use this image run the following:" >> /tmp/body-file.txt
            echo "" >> /tmp/body-file.txt
            echo '```bash' >> /tmp/body-file.txt
            echo 'cd $(mktemp -d)' >> /tmp/body-file.txt
            echo 'git clone git@github.com:opendatahub-io/data-science-pipelines-operator.git' >> /tmp/body-file.txt
            echo 'cd data-science-pipelines-operator/' >> /tmp/body-file.txt
            echo "git fetch origin pull/${PR_NUMBER}/head" >> /tmp/body-file.txt
            echo "git checkout -b pullrequest ${PR_SOURCE_BRANCH}" >> /tmp/body-file.txt
            echo 'oc new-project opendatahub' >> /tmp/body-file.txt
            echo "make deploy IMG=\"${IMG}\"" >> /tmp/body-file.txt
            echo '```' >> /tmp/body-file.txt
            echo "" >> /tmp/body-file.txt
            echo "More instructions [here](https://github.com/opendatahub-io/data-science-pipelines-operator#deploy-dsp-instance) on how to deploy and test a Data Science Pipelines Application." >> /tmp/body-file.txt
          fi

          gh pr comment "${PR_NUMBER}" --body-file /tmp/body-file.txt

  clean-pr-images:
    if: needs.fetch-data.outputs.pr_state == 'closed'
    runs-on: ubuntu-latest
    needs: fetch-data
    concurrency:
      group: ${{ github.workflow }}-clean-pr-images-${{ needs.fetch-data.outputs.pr_number }}
      cancel-in-progress: true
    env:
      TARGET_IMAGE_TAG: pr-${{ needs.fetch-data.outputs.pr_number }}
    steps:
      - name: Delete PR image
        shell: bash
        env:
          QUAY_ID: ${{ secrets.QUAY_ID }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          tag=$(curl --request GET "https://quay.io/api/v1/repository/${QUAY_ORG}/${IMAGE_REPO_DSPO}/tag/?specificTag=${TARGET_IMAGE_TAG}")
          exists=$(echo ${tag} | yq .tags - | yq any)
          IMAGE="quay.io/${QUAY_ORG}/${IMAGE_REPO_DSPO}:${TARGET_IMAGE_TAG}"
          if [[ "$exists" == "true" ]]; then
            echo "PR Closed deleting image...${IMAGE}."
            skopeo delete --creds "${QUAY_ID}:${QUAY_TOKEN}" docker://${IMAGE}
          else
            echo "Deletion of image ${IMAGE} skipped because image already does not exist."
          fi
