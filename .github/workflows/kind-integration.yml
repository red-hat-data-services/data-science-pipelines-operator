name: KinD DSPO/DSP Integration Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - go.mod
      - go.sum
      - controllers/**
      - api/**
      - config/**
      - tests/**
      - .github/resources/**
      - .github/actions/**
      - '.github/workflows/kind-integration.yml'
      - '.github/scripts/tests/tests.sh'
      - '.github/scripts/python_package_upload/**'
      - Makefile
    types:
      - opened
      - reopened
      - closed
      - synchronize

concurrency:
  group: ${{ github.head_ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  GIT_WORKSPACE: ${{ github.workspace }}

jobs:
  dspo-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
        id: go

      - name: Setup and start KinD cluster
        uses: ./.github/actions/kind

      - name: Build and push DSP images
        run: bash ${{ github.workspace }}/.github/scripts/build_dsp_images.sh
        env:
          GIT_WORKSPACE: ${{ github.workspace }}

      - name: Run test
        id: test
        working-directory: ${{ github.workspace }}/.github/scripts/tests
        run: |
          bash tests.sh --kind
        continue-on-error: true

      - name: Debug deployment env vars
        if: steps.test.outcome != 'success'
        run: |
          echo "=== API Server Deployment env vars ==="
          kubectl get deploy -n test-dspa -o jsonpath='{range .items[*].spec.template.spec.containers[*].env[*]}{.name}={.value}{"\n"}{end}' 2>/dev/null | grep -i "MINIO\|OBJECT" || echo "No deployment found"
          echo "=== params.env ==="
          grep "IMAGES_" config/base/params.env || true
          echo "=== DSPO ConfigMap ==="
          kubectl get configmap dspo-parameters -n opendatahub -o yaml 2>/dev/null | grep "IMAGES_\|ApiServer" || echo "No configmap found"
        continue-on-error: true

      - name: Collect events and logs
        if: steps.test.outcome != 'success'
        working-directory: ${{ github.workspace }}/.github/scripts/tests
        run: |
          ./collect_logs.sh --dspa-ns test-dspa --dspo-ns opendatahub
          ./collect_logs.sh --dspa-ns dspa-ext --dspo-ns opendatahub
          ./collect_logs.sh --dspa-ns test-k8s-dspa --dspo-ns opendatahub
          exit 1
