kind: Deployment
apiVersion: apps/v1
metadata:
  name: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      securityContext:
        fsGroup: 1001
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio
        - name: minio-certs
          secret:
            secretName: minio-certs
            items:
              - key: public.crt
                path: public.crt
              - key: private.key
                path: private.key
            defaultMode: 420
        - name: s3config
          secret:
            secretName: seaweedfs-s3config
      containers:
        - resources:
            limits:
              cpu: 500m
              memory: 500Mi
            requests:
              cpu: 32m
              memory: 128Mi
          name: seaweedfs
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8334
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - 'test "$(curl --silent --max-time 3 --output /dev/null --write-out "%{http_code}" http://127.0.0.1:8333/)" = 403'
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: minio
            - name: minio-certs
              mountPath: /tls
              readOnly: true
            - name: s3config
              mountPath: /etc/seaweedfs-config
              readOnly: true
          image: 'docker.io/chrislusf/seaweedfs:4.07'
          args:
            - server
            - '-dir=/data'
            - '-s3'
            - '-filer'
            - '-master.volumePreallocate=false'
            - '-s3.config=/etc/seaweedfs-config/s3.json'
            - '-s3.cert.file=/tls/public.crt'
            - '-s3.key.file=/tls/private.key'
            - '-s3.port.https=8334'
  strategy:
    type: Recreate
